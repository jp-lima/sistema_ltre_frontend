<svg xmlns="http://www.w3.org/2000/svg" viewBox="80 30 320 445" width="320" height="445" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dropGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29B6F6"/>
      <stop offset="0.45" stop-color="#1578C8"/>
      <stop offset="1" stop-color="#0A3A7C"/>
    </linearGradient>
    <clipPath id="dropClip">
